# FreshCheck — Render Blueprint (free tier)
# Deploy: push this repo to GitHub, then in the Render dashboard
# "New +" -> "Blueprint" -> connect this repo. No card is needed for
# the free plan. Set TAVILY_API_KEY in the dashboard (never in a file).
services:
  - type: web
    name: freshcheck
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd prototype && python3 server.py
    healthCheckPath: /health
    envVars:
      - key: TAVILY_API_KEY
        sync: false
